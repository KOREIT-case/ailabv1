# 인구·동네(region/) 배포 — 원천 통계 내려받기부터 워커 배포까지 한 번에.
#
# 왜 Actions 인가
#   배포에 wrangler 로그인이 필요해 폰에서는 손을 못 댄다. 여기로 옮겨 두면
#   GitHub 앱/브라우저에서 버튼만 누르면 된다(챗봇 deploy.yml 과 같은 이유).
#   덤으로 통계가 매월 갱신되므로 정기 실행도 여기 걸어 둔다.
#
# 준비물 (챗봇 배포와 같은 시크릿을 그대로 쓴다 — 이미 있으면 추가 작업 없음)
#   https://github.com/KOREIT-case/ailabv1/settings/secrets/actions
#     · CLOUDFLARE_API_TOKEN   "Edit Cloudflare Workers" 템플릿으로 발급
#                              (Workers 스크립트 편집 + Workers KV 저장소 편집 권한)
#     · CLOUDFLARE_ACCOUNT_ID  대시보드의 Account ID
#
# 실행
#   https://github.com/KOREIT-case/ailabv1/actions/workflows/region-deploy.yml
#   → Run workflow → 대상 선택
name: 인구·동네 배포

on:
  workflow_dispatch:
    inputs:
      target:
        description: "배포 대상 (all=전체 / data=자료만 / code=코드만)"
        required: true
        default: all
        type: choice
        options: [all, data, code]
      og:
        description: "공유 카드 PNG 를 미리 구울 개수 (0=건너뜀). KV 쓰기 한도 때문에 상위 N곳만"
        required: false
        default: "300"
        type: string
  # 이 브랜치에 region/ 이 바뀌면 바로 나간다. 아직 main 에 합치기 전이라 손으로 누를
  # 버튼(workflow_dispatch)이 안 보이므로, push 로 걸어 둬야 실제로 돌릴 수 있다.
  push:
    branches: [claude/ad-free-region-calculator-mc42jf]
    paths:
      - "region/**"
      - ".github/workflows/region-deploy.yml"
  # 행안부 통계는 매월 초에 갱신된다. 매월 6일 05:00 KST(= 5일 20:00 UTC).
  # ※ 정기 실행은 기본 브랜치에 합친 뒤부터 동작한다(GitHub 규칙).
  schedule:
    - cron: "0 20 5 * *"

concurrency:
  group: region-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: ${{ inputs.target || 'all' }}
      OG: ${{ inputs.og || '300' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 시크릿이 없으면 뒤 단계에서 알 수 없는 오류로 죽는다. 여기서 먼저 걸러
      # 무엇을 넣어야 하는지 알려 준다.
      - name: 시크릿 확인
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "✗ 저장소 시크릿이 없습니다:$missing"
            echo "  등록: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "  토큰 발급: https://dash.cloudflare.com/profile/api-tokens"
            echo "            → Create Token → 'Edit Cloudflare Workers' 템플릿"
            echo "            (Workers 스크립트 편집 + Workers KV 저장소 편집 권한 포함)"
            exit 1
          fi
          echo "✓ 시크릿 확인"

      # 자료는 커밋하지 않는다(원천 CSV 18MB, 매월 갱신). 배포 때마다 새로 받는다.
      - name: 원천 통계 내려받기 (행정안전부)
        if: env.TARGET != 'code'
        run: node region/scripts/fetch-jumin.mjs

      - name: 자료 빌드
        if: env.TARGET != 'code'
        run: node region/scripts/build-data.mjs

      # 주소 규칙이 깨졌거나 법정동 합계가 시군구 합계와 안 맞으면 여기서 멈춘다.
      - name: 점검 (주소·합계·극단값·광고없음)
        if: env.TARGET != 'code'
        run: node region/scripts/test-routes.mjs

      # 공유 카드 PNG. 실패해도 배포는 계속한다 — 없으면 워커가 SVG 로 넘긴다.
      - name: 공유 카드 굽기
        if: env.TARGET != 'code' && env.OG != '0'
        continue-on-error: true
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node region/scripts/make-og.mjs --top "$OG"

      - name: KV 업로드
        if: env.TARGET != 'code'
        run: bash region/scripts/kv-upload.sh

      - name: 워커 배포 (ingu)
        if: env.TARGET != 'data'
        working-directory: region/worker
        run: npx wrangler deploy

      # 배포됐다는 말만 믿지 않고 실제 응답을 확인한다.
      # %{http_code} 는 프록시의 CONNECT 200 을 집을 수 있고, curl -I 는 HEAD 라 405 가 온다.
      # → GET 으로 보내되 본문은 버리고 헤더만 읽는다.
      - name: 배포 확인
        if: env.TARGET != 'data'
        run: |
          BASE="https://ingu.explozn87.workers.dev"
          status() { curl -s -o /dev/null -D - "$1" --max-time 25 | grep -Eo "^HTTP/[0-9.]+ [0-9]{3}" | tail -1 | awk "{print \$2}"; }
          home=$(status "$BASE/")
          dong=$(status "$BASE/%EB%8C%80%EA%B5%AC/%EC%A4%91%EA%B5%AC/%EB%82%A8%EC%82%B0%EB%8F%99")
          card=$(status "$BASE/og/2711015600.svg")
          echo "전국   $BASE/ → HTTP $home"
          echo "남산동 $BASE/대구/중구/남산동 → HTTP $dong"
          echo "카드   $BASE/og/2711015600.svg → HTTP $card"
          [ "$home" = "200" ] && [ "$dong" = "200" ] || { echo "✗ 페이지가 200이 아닙니다"; exit 1; }
          echo ""
          echo "✓ 배포 완료 — $BASE"
