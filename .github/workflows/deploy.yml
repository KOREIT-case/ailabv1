# 챗봇 배포 — GitHub Actions 버튼 하나로.
#
# 왜 있나
#   명근이 모바일에서 작업하는 경우가 많은데, 배포는 터미널에서 wrangler 로그인이 필요해
#   폰에서는 손을 못 댄다. Actions 로 옮겨 두면 GitHub 앱/브라우저에서 버튼만 누르면 된다.
#
# 최초 1회 준비 (둘 다 폰 브라우저에서 가능)
#   1) Cloudflare API 토큰 발급
#      https://dash.cloudflare.com/profile/api-tokens → Create Token
#      → "Edit Cloudflare Workers" 템플릿 사용 (Workers 스크립트 + KV 쓰기 권한 포함)
#   2) 저장소 시크릿 등록
#      https://github.com/KOREIT-case/ailabv1/settings/secrets/actions
#      · CLOUDFLARE_API_TOKEN   = 위에서 발급한 토큰
#      · CLOUDFLARE_ACCOUNT_ID  = 대시보드 우측 하단(또는 Workers 개요)의 Account ID
#
#   ※ DEEPSEEK_KEY·SITE_PASSWORD 는 이미 Cloudflare 워커 시크릿으로 들어가 있고
#     wrangler deploy 가 기존 시크릿을 지우지 않으므로 여기서 다룰 필요가 없다.
#
# 실행
#   https://github.com/KOREIT-case/ailabv1/actions/workflows/deploy.yml
#   → "Run workflow" → 대상 선택(all / corpus / code) → 실행
name: 챗봇 배포

on:
  workflow_dispatch:
    inputs:
      target:
        description: "배포 대상 (all=전체 / corpus=자료만 / code=코드만)"
        required: true
        default: all
        type: choice
        options: [all, corpus, code]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 검색 인덱스는 커밋하지 않으므로(재생성 가능) 배포 때마다 새로 만든다.
      - name: 검색 인덱스 빌드
        if: ${{ inputs.target != 'code' }}
        run: node scripts/build-index.mjs | tail -1

      # 검색이 깨진 채로 나가는 것을 막는 마지막 관문.
      # 기준선(golden-baseline.json)보다 순위가 내려간 케이스가 있으면 종료코드 1 → 배포 중단.
      # 미검색 건수 자체는 아직 안 고친 결함이 원인이라 실패로 치지 않는다.
      - name: 회귀 스위트
        if: ${{ inputs.target != 'code' }}
        run: node scripts/test-golden.mjs --diff scripts/golden-baseline.json

      - name: corpus 인덱스 KV 업로드
        if: ${{ inputs.target != 'code' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/kv-upload.sh

      - name: 본 워커 배포 (jeongbi)
        if: ${{ inputs.target != 'corpus' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: chatbot/worker
        run: npx wrangler deploy

      # 주소를 줄일 때 옛 워커가 살아남아 '구버전 법률 챗봇'이 계속 서비스됐다.
      # 같은 이름으로 리다이렉트를 덮어써 현행 주소로 넘긴다.
      - name: 구주소 리다이렉트 배포 (dosijeongbi-chatbot)
        if: ${{ inputs.target != 'corpus' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: chatbot/redirect
        run: npx wrangler deploy

      # 배포됐다는 말만 믿지 않고 실제 응답을 확인한다.
      - name: 배포 확인
        run: |
          # %{http_code} 는 프록시의 CONNECT 200 을 집을 수 있고, curl -I 는 HEAD 라 워커가 405를 준다.
          # → GET 으로 보내되 본문은 버리고 헤더만 읽는다.
          status() { curl -s -o /dev/null -D - "$1" --max-time 20 | grep -Eo "^HTTP/[0-9.]+ [0-9]{3}" | tail -1 | awk "{print \$2}"; }
          main=$(status https://jeongbi.explozn87.workers.dev)
          old=$(status https://dosijeongbi-chatbot.explozn87.workers.dev)
          echo "현행 jeongbi → HTTP $main"
          echo "구주소 dosijeongbi-chatbot → HTTP $old"
          [ "$main" = "200" ] || { echo "✗ 현행 주소가 200이 아닙니다"; exit 1; }
          if [ "${{ inputs.target }}" != "corpus" ] && [ "$old" != "301" ]; then
            echo "⚠ 구주소가 301이 아닙니다 — 리다이렉트 배포를 확인하세요"
          fi
          echo ""
          echo "마지막 확인은 사람이: 챗봇에 '체비지 취득세 감면 되나요' 를 물어보고"
          echo "근거에 '심판례 조심 2025지…' 가 뜨면 corpus 반영까지 완료된 것."
