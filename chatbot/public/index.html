<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>도시정비 법률 챗봇</title>

<!-- ── GA4 운영 실적 측정 ──────────────────────────────────────────────
  측정 ID는 Worker가 서빙할 때 env.GA_ID 값으로 __GA_ID__ 자리를 치환한다.
  (wrangler.toml 의 [vars] GA_ID 참조. 미설정이면 track() 이 무동작 →
   GA 스크립트를 아예 불러오지 않으므로 로컬/미설정 환경에서도 안전.)

  ★ 측정 시작 시점 = "로그인 성공(또는 세션 복구)" 이다. 페이지를 여는 것만으로는
    아무것도 전송하지 않는다. 이유 2가지:
      1) 로그인해야 쓸 수 있는 도구라, 실적의 단위는 '방문'이 아니라 '입장'이다.
      2) 아래 EXCLUDED_USERS(운영자 점검 계정)를 방문수(page_view)까지 통째로 제외하려면
         초기화 자체를 이름 확인 뒤로 미뤄야 한다.

  수집하는 것: 입장 건수, 질문 건수, 질의 유형, 검색범위, 응답시간, 근거 유무.
  수집하지 않는 것: 질문 원문·답변 원문·이름(이름은 8자리 해시로만 전송).
  자세한 설계·설정 절차는 docs/ga4-운영실적-가이드.md 참조.
-->
<script>
(function(){
  var id = "__GA_ID__";

  /* 실적 집계에서 제외할 사용자 이름 (운영자 점검용).
     명근이 점검할 때 쓰는 이름. 여기 적힌 이름으로 입장하면 GA 스크립트를 아예
     로드하지 않아 방문·질문 어느 것도 기록되지 않는다.
     ※ 이름이 정확히 일치해야 제외된다(앞뒤 공백은 무시). 오타로 들어가면 집계에 잡힌다.
     ※ '상태점검' 은 scripts/healthcheck.mjs 가 쓰는 이름이다. 점검은 대전제 검증을 위해
       일부러 범위 밖 질문을 던지므로 실적에서 빼야 한다.
     ※ chatbot/worker/unanswered.mjs 의 EXCLUDED_USERS(미답변 기록 제외)와 같은 값 유지. */
  var EXCLUDED_USERS = ["박새", "상태점검"];

  var enabled = false;                                   // gtag 초기화 완료 여부
  var configured = !id || id.charAt(0) === "_";          // 치환 전/미설정이면 영구 비활성
  window.track = function(){};                           // 초기화 전 호출은 무동작

  // 이름 → 8자리 해시(FNV-1a). 실사용자 수·재방문 파악용이며 원문 이름은 보내지 않는다.
  function nameHash(s){
    var h = 2166136261;
    for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ("0000000" + (h >>> 0).toString(16)).slice(-8);
  }

  /* 입장 확정 시 1회 호출 → GA 로드 + page_view 전송 + 사용자 식별.
     제외 대상이거나 GA_ID 미설정이면 아무 일도 하지 않는다. */
  window.gaStart = function(name){
    if (configured || enabled) return;
    var clean = (name || "").trim();
    for (var i = 0; i < EXCLUDED_USERS.length; i++){
      if (clean === EXCLUDED_USERS[i]) { configured = true; return; }   // 운영자 점검 → 측정 안 함
    }
    /* 이름 오타 대비 백업 장치 — 주소 뒤에 ?nostat=1 을 붙여 한 번 접속하면
       그 브라우저는 이후 영구히 측정 제외(브라우저 저장소에 기록).
       해제: ?nostat=0 으로 접속. */
    try {
      if (location.search.indexOf("nostat=1") > -1) localStorage.setItem("nostat", "1");
      if (location.search.indexOf("nostat=0") > -1) localStorage.removeItem("nostat");
      if (localStorage.getItem("nostat") === "1") { configured = true; return; }
    } catch (e) { /* 저장소 차단 환경이면 이름 기준 제외만 적용 */ }
    window.dataLayer = window.dataLayer || [];
    window.gtag = function(){ dataLayer.push(arguments); };
    gtag("js", new Date());
    gtag("config", id, { anonymize_ip: true, user_id: nameHash(clean) });

    var s = document.createElement("script");
    s.async = true;
    s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(id);
    document.head.appendChild(s);

    enabled = true;
    window.track = function(n, params){ try{ gtag("event", n, params || {}); }catch(e){} };
  };
})();
</script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --border:#262b36;
    --text:#eef0f5; --dim:#9aa0ad; --accent:#4f7cff; --accent-soft:rgba(79,124,255,.14);
    --user:#233046; --warn:#f0b429; --err:#f0576a;
  }
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;flex-direction:column;
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg) center/cover fixed no-repeat;color:var(--text)}
  header{padding:14px 18px;border-bottom:1px solid var(--border);
    background:rgba(23,26,33,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:space-between;gap:12px}
  header h1{margin:0;font-size:16px}
  header p{margin:4px 0 0;font-size:12px;color:var(--dim)}
  #who{font-size:12px;color:var(--dim);white-space:nowrap;text-align:right}
  #who b{color:var(--text)}
  #logout{background:none;border:1px solid var(--border);color:var(--dim);
    border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;margin-top:4px}
  #chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:820px;width:fit-content;padding:12px 14px;border-radius:12px;
    line-height:1.55;font-size:14px;white-space:pre-wrap;word-break:break-word}
  .user{align-self:flex-end;background:var(--user)}
  .bot{align-self:flex-start;background:var(--panel);border:1px solid var(--border)}
  .bot .src{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);
    font-size:12px;color:var(--dim)}
  .bot .src .key{color:var(--accent);font-weight:600} /* 핵심 법리(최상위 근거) 강조 */
  .bot .src .arts{color:var(--text)} /* 조문 번호는 조금 더 또렷하게 */
  /* '이 답변 이상해요' 신고 — 눈에 띄되 답변을 방해하지 않게 흐리게 두고 hover 시 또렷하게 */
  .bot .rep{margin-top:8px;font-size:11px;color:var(--dim);opacity:.65}
  .bot .rep button{background:none;border:none;color:var(--dim);font-size:11px;
    cursor:pointer;padding:0;text-decoration:underline;font-family:inherit}
  .bot .rep button:hover{color:var(--accent)}
  .bot .rep.done{color:var(--accent);opacity:1}
  .bot .rep input{background:#0c0e12;border:1px solid var(--border);color:var(--fg);
    border-radius:6px;padding:4px 7px;font-size:12px;font-family:inherit;width:min(340px,60vw)}
  .bot .rep .go{border:1px solid var(--border);border-radius:6px;padding:4px 9px;
    text-decoration:none;color:var(--fg)}
  .bot strong{color:#fff;font-weight:700}
  .bot code{background:#0c0e12;padding:1px 5px;border-radius:5px;font-size:13px}
  .bot ul{margin:6px 0;padding-left:20px}
  .bot li{margin:2px 0}
  .notice{align-self:center;font-size:12px;color:var(--dim);text-align:center;max-width:640px}
  .scopebar{display:flex;gap:16px;align-items:center;padding:9px 18px;
    background:rgba(23,26,33,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--border);font-size:13px;color:var(--dim)}
  .scopebar label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  .scopebar input{accent-color:var(--accent);width:15px;height:15px;margin:0}
  .scopebar .hint{margin-left:auto;font-size:11px;color:var(--dim)}
  .scopebar select{background:rgba(23,26,33,.9);color:var(--fg);border:1px solid var(--border);
    border-radius:6px;padding:2px 6px;font-size:12px;cursor:pointer}
  .scopebar select:disabled{opacity:.4;cursor:not-allowed}
  form#form{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--border);
    background:rgba(23,26,33,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  textarea{flex:1;resize:none;background:var(--bg);color:var(--text);
    border:1px solid var(--border);border-radius:10px;padding:11px 12px;font-size:14px;
    font-family:inherit;min-height:46px;max-height:160px}
  button{background:var(--accent);color:#fff;border:0;border-radius:10px;
    padding:0 18px;font-size:14px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}

  /* ── 로그인 화면 ── */
  #login{position:fixed;inset:0;z-index:100;background:var(--bg) center/cover fixed no-repeat;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .loginbox{width:100%;max-width:360px;text-align:center;
    background:rgba(18,21,28,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:34px 28px;
    box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .loginbox .logo{font-size:40px;margin-bottom:14px}
  .loginbox h1{margin:0 0 6px;font-size:20px}
  .loginbox p{margin:0 0 22px;font-size:13px;color:var(--dim);line-height:1.6}
  .loginbox input{width:100%;background:var(--panel);color:var(--text);
    border:1px solid var(--border);border-radius:10px;padding:13px 14px;font-size:15px;
    font-family:inherit;margin-bottom:10px}
  .loginbox input:focus{outline:none;border-color:var(--accent)}
  .loginbox button{width:100%;padding:13px;font-size:15px;font-weight:600;margin-top:4px}
  #loginErr{color:var(--err);font-size:13px;min-height:18px;margin-top:10px}
  .loginfoot{margin-top:18px;font-size:11px;color:var(--dim);line-height:1.6}
</style>
</head>
<body>

  <!-- 로그인 화면 (인증 전) -->
  <div id="login">
    <div class="loginbox">
      <div class="logo">🏙️</div>
      <h1>도시정비 법률 챗봇</h1>
      <p>한국토지신탁 사내 전용<br>이름과 비밀번호를 입력하면 입장합니다</p>
      <input id="loginName" placeholder="이름 (예: 김명근)" autocomplete="name" />
      <input id="loginPw" type="password" placeholder="비밀번호" autocomplete="current-password" />
      <button id="loginBtn" type="button">입장하기</button>
      <div id="loginErr"></div>
      <div class="loginfoot">등록된 법령·판례·유권해석에만 근거해 답변하는 안내 도구입니다.</div>
    </div>
  </div>

  <!-- 앱 (인증 후) -->
  <header>
    <div>
      <h1>도시정비 법률 챗봇</h1>
      <p>한국토지신탁 도시정비사업 · 등록된 자료에만 근거해 답변합니다</p>
    </div>
    <div id="who"></div>
  </header>

  <div id="chat">
    <div class="notice">
      ⚠️ 이 챗봇은 등록된 자료에 근거한 <b>안내</b>이며 법률 자문이 아닙니다.
      중요한 판단은 담당자 확인을 권장합니다.
    </div>
  </div>

  <div class="scopebar">
    <span>검색 범위</span>
    <label title="법령·시행령·시행규칙 + 행정규칙(고시) + 유권해석 + 심판례(조세심판원)"> <input type="checkbox" id="scLaw" checked /> 법령</label>
    <label><input type="checkbox" id="scPrec" /> 판례</label>
    <label><input type="checkbox" id="scOrd" /> 조례</label>
    <select id="scOrdRegion" disabled title="조례를 체크하면 지역을 선택할 수 있습니다">
      <option value="서울특별시">서울특별시</option>
      <option value="부산광역시">부산광역시</option>
      <option value="대구광역시">대구광역시</option>
      <option value="인천광역시">인천광역시</option>
      <option value="광주광역시">광주광역시</option>
      <option value="대전광역시">대전광역시</option>
      <option value="울산광역시">울산광역시</option>
      <option value="경기도">경기도</option>
    </select>
  </div>

  <form id="form">
    <textarea id="input" placeholder="궁금한 점을 입력하세요 (예: 재건축 매도청구 요건이 어떻게 되나요?)"></textarea>
    <button id="send" type="submit">전송</button>
  </form>

<script>
  // 앱과 같은 출처에서 서빙되므로 상대경로 사용(쿠키 자동 포함).
  const API = "";

  const $ = (id) => document.getElementById(id);
  const chat = $("chat"), form = $("form"), input = $("input"), send = $("send");
  function currentScope(){
    // 기본은 법령만. 조례는 체크 + 지역 선택 시에만 해당 지역 조례를 포함한다.
    const ord = $("scOrd").checked;
    return {
      law: $("scLaw").checked,
      prec: $("scPrec").checked,
      ordRegion: ord ? $("scOrdRegion").value : null,
    };
  }
  // 조례 체크박스에 따라 지역 드롭다운 활성화.
  $("scOrd").addEventListener("change", () => {
    $("scOrdRegion").disabled = !$("scOrd").checked;
  });
  const loginEl = $("login"), loginName = $("loginName"), loginPw = $("loginPw"),
        loginBtn = $("loginBtn"), loginErr = $("loginErr");
  const history = [];

  /* ── 질의 유형 분류 (GA4 실적용) ──
   * 질문 원문은 GA로 보내지 않고, 아래 유형명만 보낸다.
   * 위에서부터 먼저 걸리는 유형 하나로 판정(구체적인 주제를 위에 둔다).
   * 유형을 늘리려면 이 표에만 줄을 추가하면 된다(순서 = 우선순위). */
  const Q_TYPES = [
    ["재건축부담금",   /초과이익|재건축부담금|부담금|환수/],
    ["매도청구·청산",  /매도청구|현금청산|청산금|청산자/],
    ["수용·손실보상",  /수용|손실보상|영업보상|주거이전|이주정착|보상금|감정평가/],
    ["세금",           /취득세|재산세|양도|종부세|종합부동산|법인세|부가가치세|농어촌특별세|농특세|세율|과세|비과세|감면|중과/],
    ["관리처분·분양",  /관리처분|분양신청|분양대상|종전자산|종후자산|비례율|권리가액|추가분담/],
    ["조합·추진위",    /조합설립|추진위|조합원|총회|대의원|임원|결격|동의서|동의율|정관|해산/],
    ["시공자·계약",    /시공자|시공사|입찰|계약업무|공사비|검증|설계자|정비업체|용역/],
    ["인가·계획",      /정비구역|정비계획|사업시행계획|사업시행인가|기본계획|촉진지구|재정비촉진|존치/],
    ["소규모주택정비", /가로주택|자율주택|소규모재건축|소규모주택|빈집/],
    ["노후계획도시",   /노후계획도시|특별정비구역|기본방침/],
    ["재건축진단",     /안전진단|재건축진단|정밀진단/],
    ["신탁방식",       /신탁|사업대행|지정개발자|예비신탁/],
    ["임대·주택규모",  /임대주택|국민주택|주택규모|소형주택/],
  ];
  function classifyQuestion(q){
    for (const [name, re] of Q_TYPES) if (re.test(q)) return name;
    return "기타";
  }
  // 검색범위를 한 줄 라벨로 (예: "법령+조례(서울특별시)")
  function scopeLabel(sc){
    const parts = [];
    if (sc.law) parts.push("법령");
    if (sc.prec) parts.push("판례");
    if (sc.ordRegion) parts.push("조례(" + sc.ordRegion + ")");
    return parts.join("+") || "없음";
  }
  // 답변이 인용한 최상위 근거 법령명 (조례는 지자체 포함). 어떤 법을 많이 찾는지 파악용.
  function topLaw(sources){
    const s = sources && sources[0];
    if (!s) return "없음";
    if (s.자료유형 === "판례") return "판례 " + (s.사건번호 || "");
    const name = s.법령명 || "미상";
    return s.지자체 ? s.지자체 + " " + name : name;
  }

  function getCookie(name){
    return document.cookie.split("; ").reduce((r, c) => {
      const [k, v] = c.split("=");
      return k === name ? decodeURIComponent(v) : r;
    }, "");
  }

  /* ── 배경: 4장 중 랜덤 (koreit 메인비주얼, 어둡게 가공) ── */
  (function setBg(){
    const n = 1 + Math.floor(Math.random() * 4);
    const url = `${API}/bg/${n}.jpg`;
    document.body.style.backgroundImage =
      `linear-gradient(rgba(15,17,21,.55), rgba(15,17,21,.70)), url("${url}")`;
    loginEl.style.backgroundImage =
      `linear-gradient(rgba(13,15,19,.42), rgba(13,15,19,.62)), url("${url}")`;
  })();

  /* ── 인증 ── */
  function enterApp(name){
    // 측정 시작점 = 입장. (신규 로그인·세션 복구 두 경로가 모두 여기를 지난다)
    // 운영자 점검 계정이면 gaStart 내부에서 걸러져 아무것도 기록되지 않는다.
    gaStart(name);
    loginEl.style.display = "none";
    // 이름은 쿠키에서 오므로 반드시 이스케이프한다(태그를 이름으로 넣는 self-XSS 차단).
    $("who").innerHTML = `<b>${esc(name)}</b>님<br><button id="logout" type="button">로그아웃</button>`;
    $("logout").addEventListener("click", doLogout);
    input.focus();
  }
  async function doLogin(){
    const name = loginName.value.trim(), pw = loginPw.value;
    if(!name){ loginErr.textContent = "이름을 입력하세요."; loginName.focus(); return; }
    if(!pw){ loginErr.textContent = "비밀번호를 입력하세요."; loginPw.focus(); return; }
    loginErr.textContent = ""; loginBtn.disabled = true;
    try{
      const res = await fetch(API + "/login", {
        method:"POST", headers:{"Content-Type":"application/json"},
        credentials:"same-origin",
        body: JSON.stringify({ name, password: pw })
      });
      const data = await res.json();
      if(data.ok){
        enterApp(data.name || name);             // 내부에서 gaStart(측정 시작·제외 판정)
        track("login", { method: "password" });  // 신규 로그인만 집계(세션 복구는 page_view로 잡힘)
      }
      else { loginErr.textContent = data.error || "비밀번호가 올바르지 않습니다."; loginPw.select(); }
    }catch(err){
      loginErr.textContent = "접속 오류: " + err;
    }finally{ loginBtn.disabled = false; }
  }
  async function doLogout(){
    track("logout");
    try{ await fetch(API + "/logout", { method:"POST", credentials:"same-origin" }); }
    catch(e){}
    location.reload();
  }
  loginBtn.addEventListener("click", doLogin);
  [loginName, loginPw].forEach(el =>
    el.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); doLogin(); } })
  );

  // 이미 로그인돼 있으면(who 쿠키) 바로 앱 표시
  const who = getCookie("who");
  if(who) enterApp(who); else loginName.focus();

  /* ── 채팅 ── */
  function esc(s){
    return s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
  }
  // 경량 마크다운 렌더러 (굵게/코드/헤딩/불릿). 먼저 HTML 이스케이프 → XSS 방지.
  function renderMd(t){
    const lines = esc(t).split("\n");
    let html = "", inList = false;
    for (let line of lines){
      const bullet = line.match(/^\s*[-*]\s+(.*)$/);
      if (bullet){
        if (!inList){ html += "<ul>"; inList = true; }
        html += "<li>" + inline(bullet[1]) + "</li>";
        continue;
      }
      if (inList){ html += "</ul>"; inList = false; }
      const head = line.match(/^#{1,6}\s*(.*)$/);
      if (head){ html += "<strong>" + inline(head[1]) + "</strong>\n"; continue; }
      html += inline(line) + "\n";
    }
    if (inList) html += "</ul>";
    return html.replace(/\n$/, "");
  }
  function inline(s){
    return s
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
  }

  function add(role, text, sources){
    const el = document.createElement("div");
    el.className = "msg " + (role === "user" ? "user" : "bot");
    if (role === "user") el.textContent = text;
    else el.innerHTML = renderMd(text);
    if (sources && sources.length){
      const s = document.createElement("div");
      s.className = "src";
      s.innerHTML = "근거: " + buildSrc(sources);
      el.appendChild(s);
    }
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  /* '이 답변 이상해요' — 답이 나왔는데 틀린 경우를 잡는 유일한 경로.
     서버의 자동 판별은 '답을 못 한' 경우만 잡는다. 근거를 갖춰 그럴듯하게 틀리면
     기계는 알 수 없으므로 사람이 눌러줘야 한다.
     사유는 선택 — 안 써도 신고는 접수된다(문턱을 낮게). */
  function addReport(el, q, answer, sources, qType, scLabel){
    const box = document.createElement("div");
    box.className = "rep";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "이 답변 이상해요";
    box.appendChild(btn);
    el.appendChild(box);

    const send = async (note) => {
      box.className = "rep done";
      box.textContent = "신고 접수됐습니다. 확인 후 자료를 보완하겠습니다.";
      try{
        await fetch(API + "/report", {
          method:"POST", headers:{"Content-Type":"application/json"}, credentials:"same-origin",
          body: JSON.stringify({ question:q, answer, sources, note, q_type:qType, scope:scLabel })
        });
      }catch(e){}
      track("report_answer", { q_type: qType, scope: scLabel, has_note: note ? 1 : 0 });
    };

    btn.addEventListener("click", () => {
      box.textContent = "";
      const inp = document.createElement("input");
      inp.type = "text";
      inp.placeholder = "무엇이 이상한가요? (안 쓰고 보내도 됩니다)";
      inp.maxLength = 500;
      const go = document.createElement("button");
      go.type = "button"; go.className = "go"; go.textContent = "보내기";
      box.append(inp, " ", go);
      inp.focus();
      go.addEventListener("click", () => send(inp.value.trim()));
      inp.addEventListener("keydown", (e) => {
        if (e.key === "Enter"){ e.preventDefault(); send(inp.value.trim()); }
      });
    });
  }
  // 근거 표기: 같은 법은 하나로 묶어 조문만 나열, 맨 위(핵심 법리) 법령명은 강조.
  function buildSrc(sources){
    const groups = [];        // [{name, arts:[], prec}]
    const idx = new Map();     // 법령명 → groups 인덱스 (같은 법 묶기)
    for (const m of sources){
      // 판례·심판례는 사건 단위라 조문 표기 없이 사건번호로만 묶는다.
      if (m.자료유형 === "판례" || m.자료유형 === "심판례"){
        groups.push({ name: m.법령명 || (m.자료유형 + " " + (m.사건번호 || "")), arts: [], prec: true });
        continue;
      }
      const name = m.자료유형 === "유권해석"
        ? (m.법령명 || ("유권해석 " + (m.문서번호 || m.사건번호 || "")))
        : (m.법령명 || "");
      const art = (m.조문 || "").trim();
      if (!idx.has(name)){ idx.set(name, groups.length); groups.push({ name, arts: [] }); }
      if (art) groups[idx.get(name)].arts.push(art);
    }
    return groups.map((g, i) => {
      const nameHtml = i === 0
        ? `<span class="key">${esc(g.name)}</span>`   // 핵심 법리 강조
        : esc(g.name);
      const arts = g.arts.length ? ` <span class="arts">${esc(g.arts.join("·"))}</span>` : "";
      return nameHtml + arts;
    }).join(" · ");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if(!q) return;
    add("user", q);
    history.push({role:"user", content:q});
    input.value = ""; send.disabled = true;
    const thinking = add("bot", "자료를 확인하는 중…");
    // GA4: 질문 1건 (유형·검색범위·길이만. 질문 원문은 보내지 않는다)
    const scope = currentScope();
    const qType = classifyQuestion(q), scLabel = scopeLabel(scope);
    const t0 = Date.now();
    track("ask_question", { q_type: qType, scope: scLabel, q_len: q.length });
    try{
      const res = await fetch(API + "/", {
        method:"POST", headers:{"Content-Type":"application/json"},
        credentials:"same-origin",
        // q_type 은 GA와 같은 분류값. 서버가 답하지 못한 질문을 기록할 때 같은 유형으로
        // 남겨 GA 집계와 교차 확인이 되게 한다(서버에 분류 로직을 복제하지 않기 위해 동봉).
        body: JSON.stringify({ question:q, history, scope, q_type: qType })
      });
      if(res.status === 401){
        thinking.remove();
        track("answer_shown", { q_type: qType, result: "세션만료", latency_ms: Date.now() - t0 });
        loginErr.textContent = "세션이 만료됐습니다. 다시 로그인하세요.";
        loginEl.style.display = "flex"; loginPw.value = ""; loginName.focus();
        return;
      }
      const data = await res.json();
      thinking.remove();
      const answer = data.answer || data.error || "(응답 없음)";
      const botEl = add("bot", answer, data.sources);
      history.push({role:"assistant", content:answer});
      /* 신고 버튼은 '실제로 답한' 경우에만 붙인다.
         거절(제공된 자료로는…)과 오류는 서버가 이미 자동으로 기록하므로 중복이고,
         자동 판별이 못 잡는 건 "답은 나왔는데 틀린" 경우뿐이다. */
      if (!data.error && !/^\s*제공된 자료로는/.test(answer)){
        addReport(botEl, q, answer, data.sources || [], qType, scLabel);
      }
      // GA4: 답변 결과 1건 — 근거를 못 찾은 질문이 쌓이면 corpus 보강 신호가 된다.
      track("answer_shown", {
        q_type: qType,
        scope: scLabel,
        result: data.error ? "오류" : (/^\s*제공된 자료로는/.test(answer) ? "근거없음" : "답변"),
        latency_ms: Date.now() - t0,
        top_law: topLaw(data.sources),
        source_count: (data.sources || []).length,
      });
    }catch(err){
      thinking.textContent = "요청 중 오류가 발생했습니다: " + err;
      track("answer_shown", { q_type: qType, scope: scLabel, result: "오류",
                              latency_ms: Date.now() - t0, top_law: "없음", source_count: 0 });
    }finally{
      send.disabled = false; input.focus();
    }
  });

  // Enter 전송 / Shift+Enter 줄바꿈
  input.addEventListener("keydown", (e)=>{
    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }
  });
</script>
