# 광고 없는 동네 인구 통계 — Cloudflare Worker 배포 설정
#
# 배포는 두 갈래다.
#   · GitHub Actions  — .github/workflows/region-deploy.yml (폰에서도 버튼 하나)
#   · 로컬            — npx wrangler login 후 bash region/scripts/deploy.sh
#
# 매달(통계 갱신 시) 자료만 갱신하려면:
#   bash region/scripts/deploy.sh data           # 코드가 그대로면 재배포 불필요
name = "ingu"
main = "worker.js"
compatibility_date = "2026-07-23"

# 워커를 *.workers.dev 로 띄운다(사용자 도메인 없이 바로 접속 가능).
workers_dev = true

# 읍면동 상세는 시군구 단위로 쪼개 KV 에 둔다(번들 크기 한도 회피 + 요청당 읽기 1회).
# 공유 카드 PNG(og:{코드})도 같은 네임스페이스에 들어간다.
[[kv_namespaces]]
binding = "REGION_KV"
id = "bea16a2b58714f20917cc7c2e9f752e0"

# 이 서비스에는 시크릿이 없다. 로그인도, 외부 API 키도, 광고 스크립트도 쓰지 않는다.
